<!DOCTYPE html>
<html>
	<head>
		<link rel="shortcut icon" type="image/x-icon" href="icon/favicon.ico">
		<script type="text/javascript" src="shared.js"></script>
		<script type="text/javascript" src="cs_stats.js"></script>
		<link rel="stylesheet" href="common.css">
		<link rel="stylesheet" href="stats.css">
		<link rel="stylesheet" href="player_profile.css">
		<style>	
			#stats_table div {
				text-decoration: none;
				color: #99CCFF;
				overflow: hidden;
				text-overflow: ellipsis;
				max-width: 210px;
				display: inline-block;
				cursor: pointer;
				min-width: 5px;
				text-wrap: nowrap;
			}
		
			#stats_table td:first-child, #stats_table th:first-child {
				width: 35px;
				padding: 0 15px 0 5px;
				text-align: right;
			}
			#stats_table td:nth-child(2), #stats_table th:nth-child(2) {
				width: 150px;
				min-width: 150px;
				max-width: 150px;
				text-overflow: ellipsis;
				overflow: hidden;
				padding-right: 10px;
			}
			#stats_table a {
				text-decoration: none;
				color: #FFAA00;
				overflow: hidden;
				text-overflow: ellipsis;
				max-width: 210px;
				display: inline-block;
				cursor: pointer;
				min-width: 5px;
				text-wrap: nowrap;
			}
			#stats_table td a:hover {
				color: #FFDD77;
			}
			#stats_table td:nth-child(3), #stats_table th:nth-child(3) {
				width: 140px;
			}
			#stats_table td:nth-child(4), #stats_table th:nth-child(4) {
				width: 150px;
			}
			#stats_table td:nth-child(5), #stats_table th:nth-child(5) {
				width: 130px;
			}
			#stats_table td:nth-child(6), #stats_table th:nth-child(6) {
				width: 200px;
				min-width: 200px;
				max-width: 200px;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			#stats_table td:nth-child(7), #stats_table th:nth-child(7) {
				width: 140px;
			}
			
			#stats_table .rate-count, #stats_table .play-count {
				font-size: 11px;
				color: #bbb;
				padding-left: 10px;
			}
			
			#details_table tbody tr:nth-child(9) {
				display: none;
			}
		</style>
		<title id="tab_title">Half-Life Co-op</title>
	</head>
	
	<body>
		<div id="content">
			<h1 id="server_name">Half-Life Co-op | Custom maps</h1>
			<div id="server_link_container">
				<a class="server_link" href="/hlcoop_web/">Dashboard</a>
				<a class="server_link" target="_blank" href="steam://connect/207.148.12.159:27016">connect 207.148.12.159:27016</a>
				<span class="server_link dropdown">
					<span class="dropdown-title">Statistics</span>
					<div id="stats_dropdown" class="hidden">
						<hr>
						<a class="server_link" href="map_stats.html">Maps</a>
						<a class="server_link" href="stats.html">Players</a>
						<a class="server_link" href="cs_stats.html">Sounds</a>
					</div>
				</span>
			</div>
			<hr>
			
			<div class="stats_container">
				<div class="search-bar-container">
					<input type="text" id="search_bar" placeholder="Search...">
				</div>
				<div class="page-num-container">
					<span class="page-far page-first-container"><span class="page-bar"></span><span class="page-first"></span></span>
					<span class="page-close page-prev-container"><span class="page-prev"></span></span>
					<span class="page-num-text"><span class="page-start">1</span> - <span class="page-end">X</span> of <span class="result-total">Y</span></span>
					<span class="page-close page-next-container"><span class="page-next"></span></span>
					<span class="page-far page-last-container"><span class="page-last"></span><span class="page-bar"></span></span>
					
					<div class="results-per-page-container">
						<input type="number" min="1" id="results_per_page">
						<span>Results per page</span>
					</div>
				</div>
				
				<table id="stats_table">
					<thead>
						<th>#</th>
						<th class="sort sort-name">Sound<span class="asc"> ^</span><span class="dsc"> v</span></th>
						<th title="Number of times this sound has been used" class="sort sort-uses">Total uses<span class="asc"> ^</span><span class="dsc"> v</span></th>
						<th title="Number of players that have used this sound" class="sort sort-users">Total users<span class="asc"> ^</span><span class="dsc"> v</span></th>
						<th title="How many times the top user triggered this sound" class="sort sort-topuses">Top uses<span class="asc"> ^</span><span class="dsc"> v</span></th>
						<th title="Player who uses this sound the most" class="sort sort-user">Top user<span class="asc"> ^</span><span class="dsc"> v</span></th>
						<th title="When this sound was installed or last updated" class="sort sort-uploaded">Installed<span class="asc"> ^</span><span class="dsc"> v</span></th>
					</thead>
					<tbody></tbody>
				</table>
			</div>
		</div>
		
		<div class="footer">
			Last updated: <span id="update_time">???</span>			
		</div>
		
		<div id="player_profile"></div>
	</body>
</html>
